[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"

[workspace.dependencies]
magic-core          = { path = "crates/core" }
lang-rust           = { path = "crates/lang-rust" }
lang-swift          = { path = "crates/lang-swift" }
lang-toml           = { path = "crates/lang-toml" }
lang-shell          = { path = "crates/lang-shell" }
lang-python         = { path = "crates/lang-python" }
tree-sitter         = "0.27"
tree-sitter-swift   = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash    = "0.25"
tree-sitter-python  = "0.25"
streaming-iterator  = "0.1"
lsp-server          = "0.10"
lsp-types           = "0.97"
serde_json          = "1"
url                 = "2"
ignore              = "0.4"

[profile.release]
opt-level = 3
lto       = true
strip     = true
